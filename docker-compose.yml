services:
  db:
    image: postgres:16-alpine
    container_name: sahtemi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sahtemi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sahtemi_dev}
      POSTGRES_DB: ${POSTGRES_DB:-sahtemi}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sahtemi} -d ${POSTGRES_DB:-sahtemi}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sahtemi-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sahtemi}:${POSTGRES_PASSWORD:-sahtemi_dev}@db:5432/${POSTGRES_DB:-sahtemi}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sahtemi-bot
    restart: unless-stopped
    profiles: ["bot"]
    command: ["python", "-m", "bot.main"]
    env_file:
      - path: .env
        required: false
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      - api

volumes:
  postgres_data:
